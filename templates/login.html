<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Notice</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }


        /* --------------------------------
           HEADER
        -------------------------------- */

        .login-header {
            height: 88px;
            display: flex;
            align-items: center;
            padding: 0 42px;
            background: #111827;
            border-bottom: 1px solid #1e293b;
        }

        .brand {
            display: flex;
            align-items: center;
        }

        .brand-icon {
            width: 42px;
            height: 50px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg {
            width: 42px;
            height: 50px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 23px;
            font-weight: 600;
            color: #f8fafc;
            line-height: 1.2;
        }

        .brand-subtitle {
            margin-top: 3px;
            font-size: 13px;
            color: #94a3b8;
        }


        /* --------------------------------
           MAIN
        -------------------------------- */

        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 38px 42px 42px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        .login-title {
            margin: 0;
            text-align: center;
            color: #f8fafc;
            font-size: 28px;
            font-weight: 600;
        }

        .login-description {
            margin-top: 8px;
            margin-bottom: 30px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .form-label {
            color: #f1f5f9;
            font-weight: 500;
            margin-bottom: 7px;
        }

        .form-control {
            height: 46px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 14px;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            background: #1e293b;
            color: #f8fafc;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .login-button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            font-size: 15px;
            font-weight: 500;
        }

        .login-button:hover {
            background: #1d4ed8;
        }


        /* --------------------------------
           FOOTER
        -------------------------------- */

        .login-footer {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 12px;
            text-align: center;
            padding: 0 20px;
        }

        /* --------------------------------
        BACKGROUND BUBBLES
        -------------------------------- */

        .login-main {
            position: relative;
            overflow: hidden;
        }

        .login-main::before,
        .login-main::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: #1e293b;
            opacity: 0.65;
            pointer-events: none;
        }

        .login-main::before {
            width: 420px;
            height: 420px;
            top: -180px;
            right: -100px;
        }

        .login-main::after {
            width: 500px;
            height: 500px;
            bottom: -300px;
            left: -180px;
        }

        .login-card {
            position: relative;
            z-index: 2;
        }


        .background-bubble {
        position: absolute;
        border-radius: 50%;
        background: #1e293b;
        opacity: 0.45;
        pointer-events: none;
    }

    .bubble-one {
        width: 260px;
        height: 260px;
        top: 15%;
        left: -120px;
    }

    .bubble-two {
        width: 320px;
        height: 320px;
        bottom: -170px;
        right: 8%;
    }    
    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="login-header">

        <div class="brand">

            <div class="brand-icon">

                <svg
                    viewBox="0 0 24 30"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M18 10C18 5.58 15.31 2 12 2C8.69 2 6 5.58 6 10C6 16.5 4 19 4 19H20C20 19 18 16.5 18 10Z"
                        fill="#3B82F6"
                    />

                    <path
                        d="M9 22C9.4 23.7 10.5 25 12 25C13.5 25 14.6 23.7 15 22H9Z"
                        fill="#3B82F6"
                    />

                </svg>

            </div>


            <div class="brand-text">

                <div class="brand-name">
                    Smart Notice
                </div>

                <div class="brand-subtitle">
                    University Notice Classification & Routing System
                </div>

            </div>

        </div>

    </header>


    <!-- MAIN LOGIN -->

    <main class="login-main">

        <div class="background-bubble bubble-one"></div>
        <div class="background-bubble bubble-two"></div>

        <div class="login-card">

            <h1 class="login-title">
                Admin Login
            </h1>

            <div class="login-description">
                Sign in to access the Smart Notice administration panel
            </div>


            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST" action="/login">

                <div class="mb-3">

                    <label class="form-label">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary login-button">

                    Login

                </button>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="login-footer">

        Smart Notice © 2026 &nbsp;|&nbsp;
        University Notice Classification & Routing System

    </footer>


</body>

</html>
